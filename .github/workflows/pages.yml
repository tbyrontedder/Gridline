name: Deploy Gridline to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      page_sha256: ${{ steps.fingerprint.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Unit tests
        run: npm test
      - name: Build standalone application
        run: |
          npm run build
          node --check dist/gridline.js
          touch dist/.nojekyll
      - name: Browser integration tests
        run: bash scripts/browser-tests.sh
      - name: Fingerprint published HTML
        id: fingerprint
        run: echo "sha256=$(sha256sum dist/index.html | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify live HTML matches this build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA256: ${{ needs.build.outputs.page_sha256 }}
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          import { setTimeout as delay } from 'node:timers/promises';
          const target = new URL(process.env.PAGE_URL);
          if (target.protocol !== 'https:') throw new Error('Expected HTTPS Pages URL');
          const expected = process.env.EXPECTED_SHA256;
          if (!/^[a-f0-9]{64}$/.test(expected)) throw new Error('Invalid build fingerprint');
          let lastError;
          for (let attempt = 1; attempt <= 24; attempt++) {
            try {
              target.searchParams.set('deployment', process.env.GITHUB_SHA);
              target.searchParams.set('attempt', String(attempt));
              const response = await fetch(target, { signal: AbortSignal.timeout(15000), headers: { 'Cache-Control': 'no-cache' } });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const bytes = Buffer.from(await response.arrayBuffer());
              const actual = createHash('sha256').update(bytes).digest('hex');
              if (actual !== expected) throw new Error(`Content fingerprint mismatch: ${actual}`);
              const message = `Verified ${process.env.PAGE_URL}: HTTP ${response.status}, ${bytes.length} bytes, SHA-256 ${actual}`;
              console.log(message);
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Gridline is live\n\n${message}\n`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Verification attempt ${attempt}: ${error.message}`);
              if (attempt < 24) await delay(5000);
            }
          }
          throw lastError;
          JS
