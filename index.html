<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b4a"><meta name="description" content="Gridline — a local-first spreadsheet with a real formula engine and WebGPU rendering.">
<title>Gridline — A clearer way to work</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23176b4a'/%3E%3Cpath d='M16 17h32v30H16zM16 27h32M16 37h32M27 17v30M38 17v30' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
<header class="titlebar">
  <button class="brand" data-action="file" title="Gridline home"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span>Gridline</span></button>
  <span class="title-divider"></span>
  <button class="autosave" id="autosave" data-action="autosave" title="AutoSave keeps a recovery copy in this browser, not in a folder">AutoSave · Browser <span class="toggle on" id="autosave-toggle"></span></button>
  <div class="quick-actions"><button data-action="undo" title="Undo (Ctrl / ⌘ Z)" aria-label="Undo" data-icon="undo"></button><button data-action="redo" title="Redo (Ctrl / ⌘ Shift Z)" aria-label="Redo" data-icon="redo"></button></div>
  <div class="document-title"><input id="workbook-title" aria-label="Workbook title" value="Revenue operations · FY2026"><span class="save-status" id="save-status">Saved in this browser</span></div>
  <button class="global-search" data-action="commands"><span data-icon="search"></span><span>Search tools, actions, and help</span><kbd>⌘ K</kbd></button>
  <button class="avatar" data-action="about" title="About your local workspace">GL</button>
</header>
<div class="tabs-row">
  <nav class="ribbon-tabs" aria-label="Ribbon tabs" id="ribbon-tabs">
    <button data-action="file" class="file-tab">File</button>
    <button data-tab="Home" class="selected">Home</button><button data-tab="Insert">Insert</button><button data-tab="Page Layout">Page Layout</button><button data-tab="Formulas">Formulas</button><button data-tab="Data">Data</button><button data-tab="Review">Review</button><button data-tab="View">View</button><button data-tab="Help">Help</button>
  </nav>
  <div class="document-actions"><button data-action="notes"><span data-icon="comment"></span> Notes</button><span class="editing-label"><span data-icon="edit"></span> Editing</span><button class="export-button" data-action="export"><span data-icon="export"></span> Export <span class="chevron">⌄</span></button></div>
</div>
<section class="ribbon" id="ribbon" aria-label="Formatting controls"></section>
<div class="formula-row">
  <input id="name-box" value="G13" aria-label="Cell address or range" spellcheck="false"><span class="name-chevron">⌄</span>
  <span class="formula-divider"></span><button data-action="cancel-edit" class="formula-control" title="Cancel edit (Escape)" aria-label="Cancel edit">×</button><button data-action="commit-edit" class="formula-control accept" title="Apply edit" aria-label="Apply edit">✓</button><button data-action="functions" class="fx" title="Insert function">ƒx</button>
  <input id="formula-input" spellcheck="false" autocomplete="off" aria-label="Formula bar" value="=SUM(D13:F13)"><button data-action="expand-formula" class="formula-expand" title="Expand formula input" aria-label="Expand formula input">⌄</button>
</div>
<div class="workspace" id="workspace">
  <main id="grid-host" class="grid-host" tabindex="0" role="grid" aria-label="Spreadsheet" aria-rowcount="1048576" aria-colcount="16384" aria-activedescendant="active-cell-description">
    <div class="chart-layer" id="chart-layer"></div>
    <textarea id="cell-editor" class="cell-editor" spellcheck="false" aria-label="Edit cell" hidden></textarea>
    <div id="formula-suggestions" class="formula-suggestions" hidden></div>
    <div class="v-scrollbar" id="v-scrollbar"><div class="scroll-thumb" id="v-thumb"></div></div>
    <div class="h-scrollbar" id="h-scrollbar"><div class="scroll-thumb" id="h-thumb"></div></div>
    <div class="sr-only" id="active-cell-description" role="gridcell" aria-live="polite"></div>
    <div id="loading" class="loading"><span class="loading-logo">G</span><span>Opening your workspace…</span></div>
  </main>
  <aside class="side-panel" id="side-panel" hidden></aside>
</div>
<div class="sheet-bar">
  <div class="sheet-navigation"><button data-action="prev-sheet" title="Previous sheet" aria-label="Previous sheet">‹</button><button data-action="next-sheet" title="Next sheet" aria-label="Next sheet">›</button><button data-action="sheets" title="All worksheets" aria-label="All worksheets" data-icon="list"></button></div>
  <div id="sheet-tabs" class="sheet-tabs"></div><button class="new-sheet" data-action="add-sheet" title="New worksheet" aria-label="New worksheet">＋</button>
  <div class="sheet-bar-hint"><span class="local-dot"></span> Your data stays on your device</div>
</div>
<footer class="statusbar">
  <span id="mode-status">Ready</span><span class="status-divider"></span><button class="renderer-status" id="renderer-status" data-action="performance"><span class="engine-dot"></span><span id="backend-label">Starting engine</span></button>
  <span id="selection-stats" class="selection-stats"></span>
  <div class="view-controls"><button data-action="toggle-gridlines" title="Toggle gridlines" aria-label="Toggle gridlines" data-icon="grid"></button><button data-action="theme" title="Toggle dark mode" aria-label="Toggle dark mode" data-icon="moon"></button><span class="status-divider"></span><button data-action="zoom-out" title="Zoom out" aria-label="Zoom out">−</button><input id="zoom-slider" type="range" min="50" max="200" step="10" value="100" aria-label="Worksheet zoom"><button data-action="zoom-in" title="Zoom in" aria-label="Zoom in">＋</button><button id="zoom-value" data-action="zoom-reset" title="Reset zoom">100%</button></div>
</footer>
</div>
<div id="context-menu" class="context-menu" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="dialog"><div id="dialog-content"></div></dialog>
<input id="file-input" type="file" accept=".gridline,.json,.csv,.tsv,.xlsx" hidden>
<div id="print-area" hidden></div>
<noscript>Gridline needs JavaScript enabled to render and edit worksheets.</noscript>
<script type="module" src="src/app.js"></script>
</body></html>
